<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent CLI Hub</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#1f1f23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --panel2: #efeeea; --line: #dddcd6; --text: #1f1e1c; --muted: #6f6d66;
  --accent: #c2623f; --ok: #2f8a4c; --warn: #b7791f; --danger: #c0362c; --star: #d49400; --screen: #16161a; --screen-text: #e4e4e0;
  --sel: #fbe9e1;
  --badge-agy-bg: #dbeafe; --badge-agy-fg: #1d4ed8; --badge-agy-bd: #93c5fd;
  --badge-codex: #0f8f6f; --badge-ms365: #5b63d3; --badge-gcal: #3b82f6;
  --ctrl-h-sm: 26px; --ctrl-h-md: 30px; --hdr-h: 52px; --page-pad: 16px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 999px;
  --shadow-low: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171a; --panel: #1f1f23; --panel2: #29292e; --line: #34343a; --text: #ecebe6; --muted: #9a9890;
    --accent: #e0825f; --ok: #5cc07c; --warn: #e0b050; --danger: #e05a4d; --star: #f0b429; --screen: #0e0e11; --screen-text: #e4e4e0; --sel: #3a2a24;
    --badge-agy-bg: #1e3a5f; --badge-agy-fg: #93c5fd; --badge-agy-bd: #2e5282;
    --badge-codex: #10a37f; --badge-ms365: #7b83eb; --badge-gcal: #5b9cf0;
    --shadow-low: 0 2px 6px rgba(0,0,0,.22);
  }
}
:root[data-theme="dark"] {
  --bg: #17171a; --panel: #1f1f23; --panel2: #29292e; --line: #34343a; --text: #ecebe6; --muted: #9a9890;
  --accent: #e0825f; --ok: #5cc07c; --warn: #e0b050; --danger: #e05a4d; --star: #f0b429; --screen: #0e0e11; --screen-text: #e4e4e0; --sel: #3a2a24;
  --badge-agy-bg: #1e3a5f; --badge-agy-fg: #93c5fd; --badge-agy-bd: #2e5282;
  --badge-codex: #10a37f; --badge-ms365: #7b83eb; --badge-gcal: #5b9cf0;
  --shadow-low: 0 2px 6px rgba(0,0,0,.22);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 38%, transparent) transparent; }
*::-webkit-scrollbar { width: 7px; height: 7px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 999px; }
*::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 62%, transparent); }
*::-webkit-scrollbar-corner { background: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; display: flex; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius-md); min-height: var(--ctrl-h-md); padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; transition: border-color .15s, background .15s, opacity .15s; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .6; cursor: wait; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); min-height: var(--ctrl-h-md); padding: 0 8px; transition: border-color .15s; }
input[type="checkbox"], input[type="radio"] { min-height: 0; padding: 0; }
.mono, pre { font-family: "Cascadia Mono", Consolas, "D2Coding", monospace; }

aside { width: 344px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; transition: width .18s ease; }
.side-toggle { display: inline-flex; align-items: center; justify-content: center; width: var(--ctrl-h-md); height: var(--ctrl-h-md); min-height: var(--ctrl-h-md); padding: 0; border-radius: var(--radius-md); color: var(--muted); flex: none; }
.sel-sm { min-height: 22px; height: 22px; font-size: 11px; padding: 0 6px; max-width: 140px; text-transform: none; letter-spacing: 0; font-weight: normal; }
.side-toggle:hover { color: var(--text); }
@media (min-width: 761px) {
  body.side-collapsed aside { width: 0; border-right: 0; overflow: hidden; }
}
@media (max-width: 760px) {
  .side-toggle { display: none; }
}
aside header { height: var(--hdr-h); min-height: var(--hdr-h); padding: 0 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex: none; }
aside header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; min-width: 0; white-space: nowrap; cursor: pointer; user-select: none; transition: color .15s; }
aside header h1:hover { color: var(--accent); }
aside header button { min-height: var(--ctrl-h-md); padding: 0 9px; font-size: 12.5px; flex: none; }
#side { overflow: auto; scrollbar-gutter: stable; flex: 1; padding-bottom: 20px; }
.sec { padding: 10px 12px 4px; }
.sec h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.sec h2 .sp { flex: 1; }
.sec h2 label { text-transform: none; letter-spacing: 0; font-weight: normal; display: flex; gap: 4px; align-items: center; cursor: pointer; }
.item { padding: 6px 6px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; transition: background .12s; }
.item:hover { background: var(--panel2); }
.item.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.sel .t { font-weight: 600; }
.item .s { color: var(--muted); font-size: 11.5px; line-height: 1.5; padding: 0; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s .badge { line-height: 1.3; }
.item-end { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; align-self: center; }
.item-ago { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ag-ico { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex: none; margin-top: 1px; letter-spacing: -.03em; overflow: hidden; }
.ag-ico img { width: 16px; height: 16px; object-fit: contain; display: block; }
.ag-ico.claude { background: #fff; border: 1.5px solid #d97757; }
.ag-ico.codex { background: #fff; border: 1.5px solid #111111; }
.ag-ico.agy { background: #fff; border: 1.5px solid #4285f4; }
.ag-ico.bot, .ag-ico.cursor, .ag-ico.shell { background: var(--panel2); color: var(--text); border: 1.5px solid var(--line); }
.ag-ico.operator { background: color-mix(in srgb, var(--accent) 18%, var(--panel2)); color: var(--accent); border: 1.5px solid var(--accent); }
.ag-wrap { position: relative; display: inline-flex; flex: none; }
.ag-wrap .dot { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; margin: 0; border: 1.5px solid var(--panel); }
.rfilt { display: flex; gap: 4px; padding: 0 0 6px; }
.rfilt button { flex: 1; min-height: 24px; height: 24px; padding: 0 6px; font-size: 11.5px; border-radius: var(--radius-sm); background: transparent; color: var(--muted); border-color: transparent; }
.rfilt button:hover { background: var(--panel2); color: var(--text); border-color: transparent; }
.rfilt button.on { background: var(--sel); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); font-weight: 600; }
.item .fav { margin-left: auto; padding: 0 2px; color: var(--muted); opacity: 0; font-size: 15px; line-height: 1.2; flex: none; }
.item:hover .fav, .item .fav.on { opacity: 1; }
.item .fav.on { color: var(--star); }
@media (pointer: coarse) { .item .fav { opacity: .55; } }
.item .body { min-width: 0; flex: 1; }
/* calendar */
.calwrap { display: flex; gap: 14px; padding: 12px 16px; min-height: 100%; align-items: stretch; }
.calmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.calside { width: clamp(250px, 24vw, 360px); flex: none; display: flex; flex-direction: column; gap: 8px; }
.cgrid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(86px, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line); gap: 1px; }
.chead { background: var(--panel2); text-align: center; font-size: 12px; color: var(--muted); padding: 5px 0; }
.cday { background: var(--panel); min-height: 0; padding: 4px 5px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
.cday.out { opacity: .45; }
.cday.wk .cnum { color: var(--accent); }
.cday.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cnum { font-size: 12px; font-weight: 600; color: var(--muted); }
.cday.today .cnum { color: var(--accent); }
.cchip { font-size: 11.5px; line-height: 1.35; padding: 1px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; }
.cchip.done { text-decoration: line-through; opacity: .5; }
.cmore { font-size: 11px; color: var(--muted); padding-left: 4px; }
.ck-ev { border-color: #5cc07c; background: rgba(92,192,124,.14); }
.ck-task { border-color: #e0825f; background: rgba(224,130,95,.14); }
.ck-ms { border-color: #a78bfa; background: rgba(167,139,250,.13); }
.ck-g { border-color: #5b9cf0; background: rgba(91,156,240,.14); }
.ck-ms365 { border-color: #7b83eb; background: rgba(123,131,235,.15); }
.cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 0; flex: none; margin-top: 5px; }
.ck-d { border-color: #2bb3a6; background: rgba(43,179,166,.14); }
.cdot.ck-d { background: #2bb3a6; }
.cdot.ck-ev { background: #5cc07c; } .cdot.ck-task { background: #e0825f; } .cdot.ck-ms { background: #a78bfa; } .cdot.ck-g { background: #5b9cf0; } .cdot.ck-ms365 { background: #7b83eb; }
.ck-legend .cdot { margin: 0 3px 0 6px; vertical-align: middle; }
.cag { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.cag.warn { border-color: var(--warn); }
.crow { display: flex; gap: 7px; align-items: flex-start; cursor: pointer; padding: 2px 0; font-size: 13px; }
.crow:hover .ct { text-decoration: underline; }
@media (max-width: 1080px) { .calwrap { flex-direction: column-reverse; min-height: auto; } .calside { width: 100%; } .cgrid { grid-template-rows: auto repeat(6, minmax(72px, auto)); } .cchip { font-size: 11px; } }
.item.sub { border-left: 1px solid var(--line, #3334); border-radius: 0 7px 7px 0; padding-left: 6px; }
.item .rfold { flex: none; width: 14px; margin: 1px -4px 0 -2px; color: var(--muted); font-size: 12px; line-height: 1.4; text-align: center; cursor: pointer; user-select: none; }
.item .rfold:hover { color: inherit; }
.item .rfold.none { cursor: default; opacity: .5; }
.rsyn { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
.dot.busy { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
.dot.idle { background: var(--ok); }
.dot.dead { background: transparent; border: 1.5px solid var(--muted); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-full); background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.c { color: var(--accent); border-color: var(--accent); }
.badge.cx { color: var(--badge-codex); border-color: var(--badge-codex); }
.badge.agy { background: var(--badge-agy-bg); color: var(--badge-agy-fg); border-color: var(--badge-agy-bd); }
.empty { color: var(--muted); font-size: 12.5px; padding: 6px 9px; }

/* sidebar quick nav tiles (Astryx shell-side-nav compact density) */
.qnav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 10px 12px 4px; }
.qtile { position: relative; padding: 8px 10px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--panel2); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: border-color .15s, background .15s; }
.qtile.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; padding: 9px 12px; }
.qtile:hover { border-color: var(--accent); }
.qtile.sel { background: var(--sel); border-color: var(--accent); }
.qtile .qt { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 4px; white-space: nowrap; }
.qtile .qs { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qtile .qact { min-height: 20px; height: 20px; padding: 0 5px; font-size: 11px; border-radius: 5px; background: var(--panel); }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.bar { height: var(--hdr-h); min-height: var(--hdr-h); padding: 0 var(--page-pad); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; background: var(--panel); overflow-x: auto; flex: none; }
.bar h2 { margin: 0; font-size: 15px; font-weight: 650; flex: 1; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .sp { flex: 1; }
.tabs { display: inline-flex; gap: 2px; flex: none; background: var(--panel2); padding: 3px; border: 1px solid var(--line); border-radius: var(--radius-md); }
.tabs button { min-height: 26px; height: 26px; padding: 0 10px; font-size: 12.5px; border: 0; background: transparent; color: var(--muted); border-radius: var(--radius-sm); font-weight: 500; transition: background .12s, color .12s; }
.tabs button:hover { color: var(--text); background: color-mix(in srgb, var(--panel) 65%, transparent); }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
#view { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; scroll-behavior: smooth; position: relative; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; padding: var(--page-pad); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: var(--shadow-low); transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.1); }
.card .hd { padding: 9px 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.card .hd .t { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen { background: var(--screen); color: var(--screen-text); margin: 0; padding: 10px 12px; font-size: 12.5px; line-height: 1.35; white-space: pre; overflow: auto; }
.card .screen { height: 300px; font-size: 11px; }
/* Astryx 3-Band Dashboard Home */
.home-wrap { padding: 18px 20px 36px; display: flex; flex-direction: column; gap: 20px; max-width: 1520px; margin: 0 auto; }
.h-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.h-kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: var(--shadow-low); display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: border-color .15s; }
.h-kpi.click { cursor: pointer; }
.h-kpi.click:hover { border-color: var(--accent); }
.h-kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
.h-kpi-val { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; color: var(--text); }
.h-kpi-sub { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
.h-qbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
.h-qbtns button { min-height: 27px; height: 27px; padding: 0 9px; font-size: 12px; flex: 1; }
.h-divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
.h-sec { display: flex; flex-direction: column; gap: 12px; }
.h-sec-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.h-sec-hd h3 { margin: 0; font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
.h-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
.h-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-low); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.h-panel-hd { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.h-panel-hd h4 { margin: 0; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.h-rows { display: flex; flex-direction: column; }
.h-row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent); font-size: 13.5px; min-height: 42px; cursor: pointer; transition: background .12s; }
.h-row:first-child { border-top: 0; }
.h-row:hover { background: var(--panel2); }
.h-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.h-row-t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-row-s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-row-act { min-height: 24px; height: 24px; padding: 0 9px; font-size: 11.5px; flex: none; }
.h-empty-card { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius-lg); padding: 26px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.h-calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(54px, 1fr)); background: var(--line); gap: 1px; flex: 1; }
.h-calgrid .cday { padding: 3px 4px; gap: 2px; }
.h-calgrid .cnum { font-size: 11px; }
.h-calgrid .cchip { font-size: 10.5px; padding: 0 4px; line-height: 1.3; }
.h-calgrid .cmore { font-size: 10px; }
/* session artifacts */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.aday { font-weight: 700; margin: 14px 2px 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line, #333); }
.aday:first-of-type { margin-top: 4px; }
.acard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.acard:hover { border-color: var(--accent); }
.athumb { height: 120px; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--muted); overflow: hidden; }
.athumb svg { width: 34px; height: 34px; }
.athumb img { width: 100%; height: 100%; object-fit: cover; }
.ameta { padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ameta b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ahide { position: absolute; top: 4px; right: 4px; padding: 0 6px; font-size: 12px; opacity: 0; background: rgba(0,0,0,.55); color: #fff; border: 0; }
.acard:hover .ahide { opacity: 1; }
.asend { position: absolute; top: 4px; right: 34px; padding: 0 7px; font-size: 12px; opacity: 0; background: rgba(0,0,0,.55); color: #fff; border: 0; }
.acard[data-rout] .asend { right: 4px; }
.acard:hover .asend { opacity: 1; }
.aview { gap: 8px; }
.avbody { display: flex; justify-content: center; align-items: flex-start; overflow: auto; max-height: 78vh; }
.avbody .md, .avbody .mdpre { width: 100%; }
.btnlike { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; color: inherit; text-decoration: none; background: var(--panel2); }
.artlink { color: var(--accent); text-decoration: underline dotted; cursor: pointer; word-break: break-all; }
@media (max-width: 760px) { .agrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .athumb { height: 90px; } .ahide, .asend { opacity: 1; } }
/* GPU queue */
