<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent CLI Hub</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#1f1f23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/components.css">
<link rel="stylesheet" href="/projects.css">
</head>
<body>
<header id="tauriTitlebar" class="tauri-tb" hidden>
  <div class="tauri-tb-drag" id="tauriTbDrag">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 11.5 L6.5 6.8 M12 11.5 L17.5 6.8 M12 11.5 L12 18.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6.5" cy="6.8" r="2" fill="currentColor"/><circle cx="17.5" cy="6.8" r="2" fill="currentColor"/><circle cx="12" cy="18.2" r="2" fill="currentColor"/><circle cx="12" cy="11.5" r="2.8" fill="var(--accent)" stroke="var(--side-bg)" stroke-width="1"/></svg>
    <span class="tauri-tb-title">Agent CLI Hub</span>
  </div>
  <div class="tauri-tb-acts">
    <button type="button" class="tauri-tb-btn" data-tauri-win="minimize" aria-label="최소화" title="최소화"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button type="button" class="tauri-tb-btn" data-tauri-win="toggle-maximize" aria-label="최대화" title="최대화"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button type="button" class="tauri-tb-btn tauri-tb-close" data-tauri-win="close" aria-label="트레이로 숨기기" title="트레이로 숨기기"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 2.5L9.5 9.5M9.5 2.5L2.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</header>
<div class="mtop">
  <button id="btnMenu" class="ghost icon-btn" aria-label="목록 열기" aria-controls="sidebar" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button id="mBrandHome" class="brand" style="flex:1">
    <span class="brand-mark st-ok" id="mBrandMark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 11.5 L6.5 6.8 M12 11.5 L17.5 6.8 M12 11.5 L12 18.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6.5" cy="6.8" r="2" fill="currentColor"/><circle cx="17.5" cy="6.8" r="2" fill="currentColor"/><circle cx="12" cy="18.2" r="2" fill="currentColor"/><circle cx="12" cy="11.5" r="2.8" fill="#e5835f" stroke="#161922" stroke-width="1"/></svg><span class="brand-led" id="mBrandLed"></span></span>
    <span class="brand-txt"><span class="brand-name">Agent CLI Hub</span><span class="brand-sub" id="mBrandSub"><span class="srv-pip ok"><i></i>허브</span><span>·</span><span class="srv-pip ok"><i></i>사용량</span></span></span>
  </button>
  <button id="mBtnNew" class="ghost icon-btn" aria-label="새 터미널"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div id="backdrop"></div>
<aside class="side" id="sidebar" aria-label="워크스페이스 목록">
  <div class="side-hd">
    <button id="brandHome" class="brand" title="허브 및 사용량 서버 상태 확인">
      <span class="brand-mark st-ok" id="brandMark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 11.5 L6.5 6.8 M12 11.5 L17.5 6.8 M12 11.5 L12 18.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6.5" cy="6.8" r="2" fill="currentColor"/><circle cx="17.5" cy="6.8" r="2" fill="currentColor"/><circle cx="12" cy="18.2" r="2" fill="currentColor"/><circle cx="12" cy="11.5" r="2.8" fill="#e5835f" stroke="#161922" stroke-width="1"/></svg>
        <span class="brand-led" id="brandLed"></span>
      </span>
      <span class="brand-txt">
        <span class="brand-name">Agent CLI Hub</span>
        <span class="brand-sub" id="brandSub"><span class="srv-pip ok"><i></i>허브 ON</span><span>·</span><span class="srv-pip ok"><i></i>사용량 ON</span></span>
      </span>
    </button>
    <button id="btnSideNew" class="ghost icon-btn btn-sm" title="새 터미널 열기" aria-label="새 터미널 열기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="btnSideCollapse" class="ghost icon-btn btn-sm" title="목록 접기" aria-label="목록 접기"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><line x1="5.5" y1="2.5" x2="5.5" y2="13.5"/></svg></button>
  </div>
  <div class="side-filter"><input id="sideFilter" type="search" placeholder="사이드바에서 찾기…" autocomplete="off" aria-label="사이드바 목록 필터"></div>
  <div id="side"></div>
  <div class="side-foot">
    <button id="btnTheme" class="ghost icon-btn btn-sm" aria-label="테마 전환" title="테마: 시스템 (클릭하여 전환)"></button>
    <button id="btnLang" class="ghost icon-btn btn-sm" aria-label="언어 전환" title="언어 전환 (KO / EN)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
    <button id="btnPhone" class="ghost icon-btn btn-sm desk" aria-label="다른 기기에서 열기" title="다른 기기에서 열기 (휴대폰 QR · 링크)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg></button>
    <span class="sp"></span>
    <button id="btnSideMore" class="ghost icon-btn btn-sm" aria-label="표시 옵션" aria-haspopup="menu" aria-expanded="false" title="표시 옵션 및 알림 설정"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg></button>
  </div>
  <div id="sideResize" role="separator" aria-label="사이드바 너비 조절" aria-orientation="vertical" aria-controls="side" aria-valuemin="248" aria-valuemax="380" tabindex="0"></div>
</aside>
<main>
  <button id="btnSideReopen" class="side-float-btn icon-btn btn-sm" title="목록 펼치기" aria-label="목록 펼치기"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><line x1="5.5" y1="2.5" x2="5.5" y2="13.5"/></svg></button>
  <div id="diskBanner" class="disk-banner"></div>
  <div class="bar" id="bar"></div>
  <div id="view"></div>
</main>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script src="/ui.js"></script>
<script src="/app-core.js"></script>
<script src="/sidebar-ui.js"></script>
<script src="/home-terms-ui.js"></script>
<script src="/terminals-ui.js"></script>
<script src="/tool-stream-ui.js"></script>
<script src="/subagent-viewer.js"></script>
<script src="/files-artifacts.js"></script>
<script src="/tool-activity-ui.js"></script>
<script src="/chat-composer.js"></script>
<script src="/chat-ui.js"></script>
<script src="/usage-ui.js"></script>
<script src="/switch-gpu-ui.js"></script>
<script src="/research-ui.js"></script>
<script src="/dock.js"></script>
<script src="/preview.js"></script>
<script src="/calendar.js"></script>
<script src="/vault.js"></script>
<script src="/project-forms.js"></script>
<script src="/project-plan-form.js"></script>
<script src="/project-task-form.js"></script>
<script src="/project-flow.js"></script>
<script src="/project-floorplan.js"></script>
<script src="/project-git.js"></script>
<script src="/project-board.js"></script>
<script src="/project-harness-ui.js"></script>
<script src="/project-refs-ui.js"></script>
<script src="/project-terminals.js"></script>
<script src="/projects.js"></script>
<script src="/app.js"></script>
</body>
</html>
