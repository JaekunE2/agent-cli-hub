<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent CLI Hub</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#1f1f23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
:root {
  --bg: #f8f9fb; --side-bg: #f2f4f7; --panel: #ffffff; --panel2: #eceef3; --line: rgba(15, 23, 42, 0.08); --line-strong: rgba(15, 23, 42, 0.15);
  --text: #11141a; --muted: #555f6e;
  --accent: #b24924; --accent-fill: #b24924; --on-accent: #ffffff; --ok: #146c38; --warn: #925705; --danger: #c62821; --star: #b87b00; --screen: #101216; --screen-text: #e6e7ec;
  --sel: #fdf0ea;
  --badge-agy-bg: #e0edff; --badge-agy-fg: #1d4ed8; --badge-agy-bd: #bfdbfe;
  --badge-codex: #0b7359; --badge-ms365: #4c53b8; --badge-gcal: #2563eb;
  --ctrl-h-sm: 26px; --ctrl-h-md: 31px; --hdr-h: 48px; --side-w: 256px; --page-pad: 24px; --page-max: 1160px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 11px; --radius-full: 999px;
  --shadow-low: none;
  --shadow-med: 0 12px 30px rgba(15, 23, 42, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11; --side-bg: #101218; --panel: #151820; --panel2: #1d212c; --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.15);
    --text: #eef1f6; --muted: #9aa3b2;
    --accent: #e5835f; --accent-fill: #c24d27; --on-accent: #ffffff; --ok: #4ec47d; --warn: #eab349; --danger: #eb5e55; --star: #f2b830; --screen: #090a0e; --screen-text: #e6e7ec; --sel: rgba(229, 131, 95, 0.14);
    --badge-agy-bg: rgba(59, 130, 246, 0.16); --badge-agy-fg: #93c5fd; --badge-agy-bd: rgba(96, 165, 250, 0.28);
    --badge-codex: #10a37f; --badge-ms365: #7b83eb; --badge-gcal: #5b9cf0;
    --shadow-low: none;
    --shadow-med: 0 16px 38px rgba(0, 0, 0, .58);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11; --side-bg: #101218; --panel: #151820; --panel2: #1d212c; --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.15);
  --text: #eef1f6; --muted: #9aa3b2;
  --accent: #e5835f; --accent-fill: #c24d27; --on-accent: #ffffff; --ok: #4ec47d; --warn: #eab349; --danger: #eb5e55; --star: #f2b830; --screen: #090a0e; --screen-text: #e6e7ec; --sel: rgba(229, 131, 95, 0.14);
  --badge-agy-bg: rgba(59, 130, 246, 0.16); --badge-agy-fg: #93c5fd; --badge-agy-bd: rgba(96, 165, 250, 0.28);
  --badge-codex: #10a37f; --badge-ms365: #7b83eb; --badge-gcal: #5b9cf0;
  --shadow-low: none;
  --shadow-med: 0 16px 38px rgba(0, 0, 0, .58);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 32%, transparent) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 28%, transparent); border-radius: 999px; }
*::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 54%, transparent); }
*::-webkit-scrollbar-corner { background: transparent; }
::selection { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--text); }
::placeholder { color: var(--muted); opacity: 1; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.55 "Pretendard Variable", "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, -apple-system, sans-serif; letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; display: flex; }

/* Astryx 4-variant x 2-size button system */
button { font: inherit; font-size: 13px; color: inherit; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-md); min-height: var(--ctrl-h-md); padding: 0 11px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, opacity .15s; white-space: nowrap; }
button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--panel2) 55%, var(--panel)); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.btn-sm { min-height: var(--ctrl-h-sm); height: var(--ctrl-h-sm); padding: 0 9px; font-size: 12px; border-radius: var(--radius-sm); gap: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
button.primary { background: var(--accent-fill); color: var(--on-accent); border-color: var(--accent-fill); font-weight: 550; }
button.primary:hover { filter: brightness(1.07); background: var(--accent-fill); border-color: var(--accent-fill); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { background: var(--panel2); border-color: transparent; color: var(--text); }
button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 42%, var(--line)); background: transparent; }
button.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); border-color: var(--danger); }
button.danger.ghost { border-color: transparent; }
button.danger:focus-visible { outline-color: var(--danger); }
button.icon-btn { width: var(--ctrl-h-md); height: var(--ctrl-h-md); padding: 0; flex: none; }
button.icon-btn.btn-sm { width: var(--ctrl-h-sm); height: var(--ctrl-h-sm); padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, select { font: inherit; font-size: 13px; color: inherit; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-md); min-height: var(--ctrl-h-md); padding: 0 10px; transition: border-color .15s; }
select.btn-sm, input.btn-sm { min-height: var(--ctrl-h-sm); height: var(--ctrl-h-sm); font-size: 12px; border-radius: var(--radius-sm); padding: 0 8px; }
input[type="checkbox"], input[type="radio"] { min-height: 0; padding: 0; }
.mono, pre { font-family: "Cascadia Mono", Consolas, "D2Coding", monospace; }

/* Linear-Style Minimal Workspace Sidebar (Projects + Terminals + Recent; System grouped cleanly) */
.side { width: var(--side-w); flex: none; background: var(--side-bg, var(--panel)); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; transition: width .18s ease; }
@media (min-width: 761px) {
  body.side-collapsed .side { width: 0; border-right: 0; overflow: hidden; }
}
.side-hd { min-height: var(--hdr-h); padding: 6px 10px 6px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex: none; position: relative; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 750; letter-spacing: -.02em; color: var(--text); background: transparent; border: 0; padding: 3px 6px 3px 2px; min-height: 34px; border-radius: var(--radius-sm); flex: 1; min-width: 0; justify-content: flex-start; text-align: left; }
.brand:hover { background: var(--panel2); border-color: transparent; }
.brand-mark { position: relative; width: 26px; height: 26px; border-radius: 7px; background: #161922; color: #f8fafc; display: inline-flex; align-items: center; justify-content: center; flex: none; box-shadow: var(--shadow-low); transition: border-color .2s, transform .15s; border: 1.5px solid rgba(255,255,255,0.16); }
.brand:hover .brand-mark { transform: scale(1.04); }
.brand-mark.st-ok { border-color: color-mix(in srgb, var(--ok) 55%, rgba(255,255,255,0.2)); }
.brand-mark.st-warn { border-color: color-mix(in srgb, var(--warn) 75%, rgba(255,255,255,0.2)); }
.brand-mark.st-down { background: var(--danger); border-color: var(--danger); }
.brand-led { position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); transition: background .2s; }
.brand-led.warn { background: var(--warn); }
.brand-led.down { background: var(--danger); animation: busy-pulse 1.5s ease-in-out infinite; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; gap: 2px; }
.brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 750; }
.brand-sub { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srv-pip { display: inline-flex; align-items: center; gap: 3px; }
.srv-pip i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); display: inline-block; }
.srv-pip.ok i { background: var(--ok); }
.srv-pip.warn i { background: var(--warn); }
.srv-pip.down i { background: var(--danger); }
.srv-pop { position: fixed; top: 52px; left: 10px; z-index: 80; width: 288px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 12px; box-shadow: var(--shadow-med); display: flex; flex-direction: column; gap: 9px; animation: toast-in .14s ease-out; }
.srv-pop-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.srv-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.srv-row-l { display: flex; align-items: center; gap: 7px; min-width: 0; }
.srv-row-sub { font-size: 11px; color: var(--muted); }

#side { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 16px; display: flex; flex-direction: column; gap: 14px; }
.snav { display: flex; flex-direction: column; gap: 2px; }
.snav-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px; border-radius: var(--radius-md); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); transition: background .12s, color .12s; user-select: none; }
.snav-item:hover { background: var(--panel2); }
.snav-item.sel { background: var(--sel); color: var(--accent); font-weight: 650; }
.snav-lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snav-kbd { font: 11px/1 "Cascadia Mono", Consolas, monospace; padding: 2px 5px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.snav-meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.snav-item.sel .snav-meta { color: var(--accent); }
.snav-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.snav-dot.danger { background: var(--danger); }

.ssec { display: flex; flex-direction: column; gap: 3px; }
.ssec-hd { display: flex; align-items: center; gap: 2px; padding: 2px 4px 3px 2px; }
.ssec-fold { width: 24px; height: 24px; min-height: 24px; padding: 0; border-radius: 5px; color: var(--muted); flex: none; }
.ssec-fold svg { width: 12px; height: 12px; transition: transform .15s ease; }
.ssec-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); flex: 1; min-width: 0; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 5px; }
.ssec-title:hover { color: var(--text); }
.ssec-act { width: 24px; height: 24px; min-height: 24px; padding: 0; border-radius: 5px; }

.srow { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: var(--radius-md); cursor: pointer; transition: background .15s, border-color .2s; min-height: 32px; position: relative; border: 1px solid transparent; }
.srow:hover { background: var(--panel2); }
.srow.is-branch { background: color-mix(in srgb, var(--badge-gcal) 9%, transparent); border-color: color-mix(in srgb, var(--badge-gcal) 34%, transparent); box-shadow: inset 3px 0 0 var(--badge-gcal); }
.srow.is-branch:hover { background: color-mix(in srgb, var(--badge-gcal) 15%, transparent); border-color: color-mix(in srgb, var(--badge-gcal) 48%, transparent); }
.srow.sel { background: var(--sel); color: var(--accent); }
.srow.is-branch.sel { background: var(--sel); border-color: color-mix(in srgb, var(--accent) 42%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.srow.just-done { background: color-mix(in srgb, var(--ok) 11%, transparent); border-color: color-mix(in srgb, var(--ok) 36%, transparent); animation: done-glow 2.8s ease-in-out infinite; }
.srow.just-done:hover { background: color-mix(in srgb, var(--ok) 17%, transparent); }
.dot.busy { animation: busy-pulse 2s ease-in-out infinite; }
.term-live-pill { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-full); display: inline-flex; align-items: center; gap: 5px; flex: none; transition: background .25s, color .25s, border-color .25s; }
.term-live-pill.busy { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent); }
.term-live-pill.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.term-live-pill.idle { color: var(--muted); background: var(--panel2); border: 1px solid var(--line); }
.term-live-pill.exited { color: var(--muted); background: var(--panel2); border: 1px solid var(--line); opacity: .85; }
#termwrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; border-top: 2px solid var(--ok); transition: opacity .4s ease; }
#termwrap.term-done-flash::after { animation: term-shimmer 2.6s ease-out forwards; }
@keyframes done-glow { 0%, 100% { border-color: color-mix(in srgb, var(--ok) 28%, transparent); } 50% { border-color: color-mix(in srgb, var(--ok) 68%, transparent); } }
@keyframes busy-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes term-shimmer { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .srow.just-done, .dot.busy, #termwrap.term-done-flash::after { animation: none !important; } }
.srow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.srow-t { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.srow.sel .srow-t { font-weight: 650; }
.srow-s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; display: flex; align-items: center; gap: 4px; }
.srow-tag { font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); line-height: 16px; flex: none; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.srow-tag.proj { color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
.srow-tag.busy { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.srow-tag.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.srow-tag.con { color: var(--badge-agy-fg); background: var(--badge-agy-bg); border-color: var(--badge-agy-bd); }
.srow-tag.branch, .badge.branch { color: var(--badge-gcal); background: color-mix(in srgb, var(--badge-gcal) 12%, var(--panel2)); border-color: color-mix(in srgb, var(--badge-gcal) 34%, transparent); }
.srow-tag.branch-src, .badge.branch-src { color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--panel2)); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
.card.is-branch { border-color: color-mix(in srgb, var(--badge-gcal) 45%, var(--line)); box-shadow: inset 0 2px 0 var(--badge-gcal), var(--shadow-low); }
.srow-unread { width: 7px; height: 7px; border-radius: 50%; background: #2563eb; flex: none; }
.side-filter { padding: 8px 8px 0; flex: none; }
.side-filter input { width: 100%; height: 28px; min-height: 28px; font-size: 12px; background: var(--bg); border-color: var(--line); }
.side-filter input:focus { background: var(--panel); border-color: var(--accent); }
.sgrp-lbl { font-size: 11px; font-weight: 650; color: var(--muted); padding: 5px 8px 2px; display: flex; align-items: center; gap: 5px; }
.ssec-act.on { color: var(--accent); background: var(--sel); }
.srow-end { display: flex; align-items: center; gap: 2px; flex: none; }
.srow-meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.srow .fav, .srow .record-delete { opacity: 0; transition: opacity .12s; }
.srow:hover .fav, .srow:focus-within .fav, .srow .fav.on,
.srow:hover .record-delete, .srow:focus-within .record-delete { opacity: 1; }
@media (pointer: coarse) { .srow .fav, .srow .record-delete { opacity: .65; } }
.srow .record-delete { width: 24px; height: 24px; min-height: 24px; padding: 0; }
.srow-empty { font-size: 12px; color: var(--muted); padding: 4px 8px; }

.pj-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex: none; opacity: .75; }
.srow.sel .pj-dot { opacity: 1; }

.side-foot { border-top: 1px solid var(--line); padding: 6px 8px; display: flex; align-items: center; gap: 4px; flex: none; }
.side-foot .sp { flex: 1; }
.side-reopen { display: none; }
body.side-collapsed .side-reopen { display: inline-flex; }
.side-float-btn { position: fixed; top: 10px; left: 10px; z-index: 25; display: none; box-shadow: var(--shadow-low); }
body.side-collapsed .side-float-btn { display: inline-flex; }
.disk-banner { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); border-bottom: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); padding: 7px 20px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex: none; }
.disk-banner:empty { display: none; }

/* Page Canvas & Unified Airy Page Header */
.page-wrap { max-width: var(--page-max); margin: 0 auto; padding: 24px var(--page-pad) 48px; display: flex; flex-direction: column; gap: 20px; width: 100%; }
.page-hd { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.page-hd-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.page-hd h1 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.25; }
.page-hd-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Unified System Hub Header (AI Usage | GPU | Calendar) */
.sys-top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; flex: none; min-height: var(--hdr-h); }
.sys-top .tablist { border-bottom: 0; }
.sys-top .tablist button { min-height: var(--hdr-h); height: var(--hdr-h); }
.sys-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }

/* Brand Icons & Dots */
.ag-ico { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex: none; overflow: hidden; }
.ag-ico img { width: 14px; height: 14px; object-fit: contain; display: block; }
.ag-ico.claude { background: #fff; border: 1.5px solid #d97757; }
.ag-ico.codex { background: #fff; border: 1.5px solid #18181b; }
.ag-ico.agy { background: #fff; border: 1.5px solid #4285f4; }
.ag-ico.bot, .ag-ico.cursor, .ag-ico.shell { background: var(--panel2); color: var(--text); border: 1.5px solid var(--line-strong); }
.ag-ico.operator { background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); color: var(--accent); border: 1.5px solid var(--accent); }
.ag-wrap { position: relative; display: inline-flex; flex: none; }
.ag-wrap .dot { position: absolute; right: -2px; bottom: -2px; width: 7px; height: 7px; margin: 0; border: 1.5px solid var(--panel); }

/* Unified SegmentedControl (.seg & .tabs) and TabList (.tablist) */
.seg, .tabs { display: inline-flex; gap: 2px; flex: none; background: var(--panel2); padding: 3px; border: 1px solid var(--line); border-radius: var(--radius-md); align-items: center; }
.seg button, .tabs button { min-height: 25px; height: 25px; padding: 0 9px; font-size: 12px; border: 0; background: transparent; color: var(--muted); border-radius: var(--radius-sm); font-weight: 500; transition: background .12s, color .12s, box-shadow .12s; }
.seg button:hover, .tabs button:hover { color: var(--text); background: color-mix(in srgb, var(--panel) 55%, transparent); }
.seg button.on, .tabs button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg.sm { display: flex; width: 100%; padding: 2px; margin: 2px 0 3px; }
.seg.sm button { flex: 1; min-height: 24px; height: 24px; padding: 0 3px; font-size: 11px; }
.seg .seg-cnt { opacity: .68; font-size: 11px; font-variant-numeric: tabular-nums; }
.tablist { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tablist button { position: relative; min-height: 38px; height: 38px; padding: 0 13px; font-size: 13.5px; border: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: transparent; color: var(--muted); font-weight: 500; }
.tablist button:hover { color: var(--text); background: color-mix(in srgb, var(--panel2) 70%, transparent); }
.tablist button.on { color: var(--text); font-weight: 650; }
.tablist button.on::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: 0; height: 2px; border-radius: 2px; background: var(--accent); }
.subtoolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.subtoolbar .sp { flex: 1; }
.btn-grp { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius-md); overflow: hidden; background: var(--panel); }
.btn-grp button { border: 0; border-radius: 0; min-height: 28px; height: 28px; background: transparent; }
.btn-grp button + button { border-left: 1px solid var(--line); }
.btn-grp button:hover { background: var(--panel2); }

/* Minimal List Surface */
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-low); overflow: hidden; }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-hd h2, .sheet-hd h3, .sheet-hd h4 { margin: 0; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
.m-row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; transition: background .12s; min-height: 48px; }
.m-row:first-child { border-top: 0; }
.m-row:hover { background: color-mix(in srgb, var(--panel2) 55%, transparent); }
.m-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.m-row-t { font-size: 13.5px; font-weight: 550; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-row-s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-row-end { display: flex; align-items: center; gap: 6px; flex: none; }
.m-row .fav, .m-row .record-delete { opacity: 0; transition: opacity .12s; }
.m-row:hover .fav, .m-row:focus-within .fav, .m-row .fav.on,
.m-row:hover .record-delete, .m-row:focus-within .record-delete { opacity: 1; }
.fav { min-width: 24px; min-height: 24px; padding: 3px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); cursor: pointer; flex: none; }
.fav:hover { background: var(--panel2); }
.fav.on { color: var(--star); }
@media (pointer: coarse) { .m-row .fav, .m-row .record-delete { opacity: .7; } }

/* Zero-Card List / Section */
.list-sec { display: flex; flex-direction: column; }
.list-sec-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 6px; border-bottom: 1px solid var(--line); }
.list-sec-hd h2, .list-sec-hd h3, .list-sec-hd h4 { margin: 0; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.list-row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); font-size: 13px; transition: background .12s; }
.list-row:hover { background: color-mix(in srgb, var(--panel2) 55%, transparent); }
.list-row-main { flex: 1; min-width: 0; }
.list-row-acts { display: flex; align-items: center; gap: 5px; flex: none; }

/* Astryx MoreMenu Popover */
.more-menu { position: fixed; z-index: 70; min-width: 184px; max-width: 270px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 4px; box-shadow: var(--shadow-med); display: flex; flex-direction: column; gap: 1px; }
.mm-item { width: 100%; justify-content: flex-start; min-height: 30px; height: auto; padding: 6px 10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text); font-size: 13px; gap: 8px; text-align: left; }
.mm-item:hover { background: var(--panel2); border-color: transparent; }
.mm-item.danger { color: var(--danger); }
.mm-item.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.mm-div { height: 1px; background: var(--line); margin: 4px 6px; }

/* Floating Toast Overlay */
.toast-host { position: fixed; right: 18px; bottom: 72px; z-index: 65; display: flex; flex-direction: column; gap: 6px; pointer-events: none; max-width: min(400px, calc(100vw - 32px)); }
.toast-item { pointer-events: auto; background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); padding: 9px 14px; border-radius: var(--radius-md); font-size: 13px; box-shadow: var(--shadow-med); animation: toast-in .16s ease-out; line-height: 1.4; display: flex; align-items: center; gap: 10px; }
.toast-item.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.toast-act { min-height: 24px; height: 24px; padding: 0 9px; font-size: 11.5px; font-weight: 600; border-radius: 5px; background: var(--panel2); color: inherit; border: 1px solid var(--line-strong); flex: none; }
.toast-act:hover { background: var(--sel); border-color: var(--accent); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Command Palette Modal (Ctrl+K) */
.cmdk-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 75; display: flex; justify-content: center; align-items: flex-start; padding-top: min(14vh, 110px); }
.cmdk-box { width: min(580px, 92vw); max-height: 70vh; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-med); display: flex; flex-direction: column; overflow: hidden; }
.cmdk-top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cmdk-top input { flex: 1; border: 0; background: transparent; font-size: 14.5px; min-height: 30px; padding: 0; outline: none; }
.cmdk-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.cmdk-grp { font-size: 11px; font-weight: 650; color: var(--muted); padding: 8px 10px 3px; text-transform: uppercase; letter-spacing: .04em; }
.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; border: 0; background: transparent; width: 100%; text-align: left; justify-content: flex-start; min-height: 36px; }
.cmdk-item:hover, .cmdk-item.on { background: var(--sel); color: var(--text); border-color: transparent; }
.cmdk-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cmdk-item-t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-item-s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); background: var(--bg); }

/* Transcript inline reply shell */
.chat-shell { display: flex; flex-direction: column; height: 100%; min-height: 0; min-width: 0; width: 100%; }
.chat-scroll { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; }
.chat-reply-bar { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px; }
.chat-reply-bar.compact { padding: 8px 10px; }
.chat-conn-bar { max-width: 860px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.chat-conn-pill { display: inline-flex; align-items: center; gap: 5px; font-weight: 550; color: var(--text); }
.chat-reply-in { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; }
.chat-reply-in textarea { flex: 1; min-height: 38px; max-height: 140px; padding: 8px 12px; font-size: 13.5px; line-height: 1.45; border-radius: 12px; background: var(--bg); border: 1px solid var(--line-strong); resize: none; overflow-y: auto; }
.chat-reply-in textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
.chat-reply-in button { min-height: 38px; height: 38px; padding: 0 14px; border-radius: 10px; font-weight: 600; flex: none; }

/* Home Minimal Overview */
.h-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.h-hero-title { display: flex; flex-direction: column; gap: 2px; }
.h-hero-title h1 { margin: 0; font-size: 21px; font-weight: 750; letter-spacing: -0.025em; }
.h-hero-title span { font-size: 13px; color: var(--muted); }
.h-launch { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.h-launch-btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-md); min-height: 32px; height: 32px; padding: 0 11px 0 8px; font-size: 13px; font-weight: 550; gap: 7px; }
.h-launch-btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--panel2) 50%, var(--panel)); }
.h-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.h-stat { background: var(--panel); border: 0; border-radius: 0; padding: 15px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: background .15s; min-width: 0; }
.h-stat:hover { background: color-mix(in srgb, var(--panel2) 45%, var(--panel)); }
.h-stat-lbl { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.h-stat-val { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; line-height: 1.15; color: var(--text); }
.h-stat-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.h-empty-card { background: var(--panel); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 28px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
@media (max-width: 1080px) { .h-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .h-two { grid-template-columns: minmax(0, 1fr); } }

/* Minimal 3-Element Usage & GPU Cards */
.ugrid-sys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.ucard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: border-color .15s, background .15s; }
.ucard.click { cursor: pointer; }
.ucard.click:hover { border-color: var(--accent); background: color-mix(in srgb, var(--panel2) 25%, var(--panel)); }
.ucard.compact { padding: 12px 15px; gap: 8px; }
.ucard.reset-soon { border-color: var(--warn); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent); }
.ucard.agy-active { border-color: color-mix(in srgb, var(--ok) 65%, var(--line-strong)); background: color-mix(in srgb, var(--ok) 5%, var(--panel)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ok) 28%, transparent); }
.ucard.agy-standby { opacity: .82; }
.ucard.agy-standby:hover { opacity: 1; }
.ucard-hero { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.ucard-big { font-size: 27px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.03em; }
.ucard-big.lo { color: var(--ok); } .ucard-big.mid { color: var(--warn); } .ucard-big.hi { color: var(--danger); }
.ucard-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.badge.soon { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); font-weight: 600; }
.uh { display: flex; gap: 8px; align-items: center; min-width: 0; }
.uh .ag-ico { width: 24px; height: 24px; border-radius: 7px; margin: 0; }
.uh .ag-ico img { width: 16px; height: 16px; }
.uh b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 650; }
.umt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; margin-bottom: 4px; }
.umt .up { width: auto; font-size: 12.5px; }
.ums { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ubar { display: inline-block; height: 7px; border-radius: 999px; background: var(--panel2); overflow: hidden; width: 100%; vertical-align: middle; }
.ubar.thin { height: 6px; width: 46px; flex: none; }
.ubar i { display: block; height: 100%; border-radius: 999px; transition: width .35s ease; }
.ubar i.lo { background: var(--ok); }
.ubar i.mid { background: var(--warn); }
.ubar i.hi { background: var(--danger); }
.up { font-size: 11.5px; font-variant-numeric: tabular-nums; width: 32px; text-align: right; flex: none; }
.up.hi { color: var(--danger); font-weight: 600; } .up.mid { color: var(--warn); }
.ugrp { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.ugrp:first-of-type { border-top: 0; padding-top: 0; }
.ugrp-title { font-size: 12px; font-weight: 650; color: var(--text); }

/* calendar */
.calwrap { display: flex; gap: 16px; padding: 16px 20px; min-height: 100%; align-items: stretch; }
.calmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.calside { width: clamp(240px, 23vw, 320px); flex: none; display: flex; flex-direction: column; gap: 10px; }
.cgrid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(84px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--line); gap: 1px; }
.chead { background: var(--panel2); text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.cday { background: var(--panel); min-height: 0; padding: 5px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
.cday.out { opacity: .42; }
.cday.wk .cnum { color: var(--accent); }
.cday.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cnum { font-size: 12px; font-weight: 600; color: var(--muted); }
.cday.today .cnum { color: var(--accent); }
.cchip { font-size: 11.5px; line-height: 1.35; padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid; }
.cchip.done { text-decoration: line-through; opacity: .5; }
.cmore { font-size: 11px; color: var(--muted); padding-left: 4px; }
.ck-ev { border-color: #5cc07c; background: rgba(92,192,124,.14); }
.ck-task { border-color: #e0825f; background: rgba(224,130,95,.14); }
.ck-ms { border-color: #a78bfa; background: rgba(167,139,250,.13); }
.ck-g { border-color: #5b9cf0; background: rgba(91,156,240,.14); }
.ck-ms365 { border-color: #7b83eb; background: rgba(123,131,235,.15); }
.cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 0; flex: none; margin-top: 6px; }
.ck-d { border-color: #2bb3a6; background: rgba(43,179,166,.14); }
.cdot.ck-d { background: #2bb3a6; }
.cdot.ck-ev { background: #5cc07c; } .cdot.ck-task { background: #e0825f; } .cdot.ck-ms { background: #a78bfa; } .cdot.ck-g { background: #5b9cf0; } .cdot.ck-ms365 { background: #7b83eb; }
.ck-legend .cdot { margin: 0 3px 0 6px; vertical-align: middle; }
.cag { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.cag.warn { border-color: var(--warn); }
.crow { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; padding: 3px 0; font-size: 13px; }
.crow:hover .ct { text-decoration: underline; }
@media (max-width: 1160px) { .calwrap { flex-direction: column-reverse; min-height: auto; } .calside { width: 100%; } .cgrid { grid-template-rows: auto repeat(6, minmax(72px, auto)); } .cchip { font-size: 11px; } }

/* Dots & Semantic Badges */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.busy { background: var(--warn); }
.dot.idle { background: var(--ok); }
.dot.dead { background: transparent; border: 1.5px solid var(--muted); }
.badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: var(--radius-full); background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; line-height: 1.3; }
.badge.c { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.badge.cx { color: var(--badge-codex); background: color-mix(in srgb, var(--badge-codex) 12%, transparent); border-color: color-mix(in srgb, var(--badge-codex) 30%, transparent); }
.badge.agy { background: var(--badge-agy-bg); color: var(--badge-agy-fg); border-color: var(--badge-agy-bd); }
.badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); border-color: color-mix(in srgb, var(--ok) 28%, transparent); }
.badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.badge.lim { color: #fff; background: var(--danger); border-color: var(--danger); }
.badge.st-planned { color: var(--muted); background: var(--panel2); border-color: var(--line); }
.badge.st-doing { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 600; }
.badge.st-review { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); border-color: color-mix(in srgb, var(--warn) 32%, transparent); font-weight: 600; }
.badge.st-done { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 9px; }

/* Main & Contextual Bar (auto-hides when empty!) */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
.bar { height: var(--hdr-h); min-height: var(--hdr-h); padding: 0 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; background: var(--panel); overflow-x: auto; flex: none; }
.bar:empty { display: none; }
.bar > * { flex-shrink: 0; }
.bar h2 { margin: 0; font-size: 14.5px; font-weight: 650; flex: 1 1 80px; min-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
.bar h2 > span:not(.ag-ico):not(.ico) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .sp { flex: 1; }
#view { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; scroll-behavior: smooth; position: relative; }
.sys-body { flex: 1; min-height: 0; overflow: auto; }
.sys-shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }

/* Terminal Mirror Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: var(--shadow-low); transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.09); }
.card .hd { padding: 10px 14px; display: flex; gap: 9px; align-items: center; border-bottom: 1px solid var(--line); }
.card .hd .t { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen { background: var(--screen); color: var(--screen-text); margin: 0; padding: 10px 12px; font-size: 12.5px; line-height: 1.35; white-space: pre; overflow: auto; }
.card .screen { height: 240px; font-size: 11px; }

/* Session Artifacts */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.aday { font-weight: 700; margin: 14px 2px 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.aday:first-of-type { margin-top: 4px; }
.acard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.acard:hover { border-color: var(--accent); }
.athumb { height: 120px; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--muted); overflow: hidden; }
.athumb svg { width: 34px; height: 34px; }
.athumb img { width: 100%; height: 100%; object-fit: cover; }
.ameta { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ameta b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* GPU Switch & Stack Bar */

.sw.on { color: var(--ok); border-color: var(--ok); }

.ubar.gstack { display: flex; }

.ubar.gstack i.ext, .lg.ext { background: var(--muted); }
.lg { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px -1px 0; }

/* Research */
.rsyn { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0 8px; }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.pill.bad { background: var(--danger); color: #fff; }
.pill.muted { background: var(--panel2); color: var(--muted); }
.rban { border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; border: 1px solid; }
.rban.bad { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); border-color: var(--danger); }
.rban.warn { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border-color: var(--warn); }
.rban.ok { background: color-mix(in srgb, var(--ok) 10%, var(--panel)); border-color: var(--ok); }

.rprog { display: flex; justify-content: space-between; align-items: baseline; }

.rnow { font-size: 13.5px; line-height: 1.55; }
.tl { display: flex; flex-direction: column; margin-top: 4px; }

.linkbtn { background: transparent; border: 0; color: var(--accent); padding: 2px 0; min-height: 0; align-self: flex-start; }
.linkbtn:hover { text-decoration: underline; background: transparent; }
.ofile { display: flex; justify-content: space-between; gap: 10px; padding: 8px 6px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; }

.rsecb { padding: 0 14px 12px; }
.r-shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }

.dlg .box.wide { width: min(980px, 96vw); max-height: 90vh; }
.fvbody { overflow: auto; max-height: 76vh; }
.md { font-size: 14px; line-height: 1.65; word-break: break-word; }
.md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.3; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; } .md h4, .md h5, .md h6 { font-size: 14px; }

.md blockquote { margin: 6px 0; padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--panel2) 45%, transparent); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

.mdpre { background: var(--screen); color: var(--screen-text); padding: 10px 12px; border-radius: var(--radius-md); overflow: auto; font: 12px/1.45 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.codeblk { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; margin: 8px 0; background: var(--screen); }
.codeblk-hd { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; background: color-mix(in srgb, var(--panel2) 85%, #000); border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); font-family: "Cascadia Mono", Consolas, monospace; }
.codeblk-hd button { min-height: 22px; height: 22px; padding: 0 8px; font-size: 11px; border-radius: var(--radius-sm); }
.codeblk .mdpre { margin: 0; border-radius: 0; border: 0; }
.mdtw { overflow-x: auto; margin: 6px 0; }
.mdt { border-collapse: collapse; font-size: 13px; } .mdt th, .mdt td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; } .mdt th { background: var(--panel2); }
.rwrap { padding: 16px 20px 36px; max-width: var(--page-max); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.rcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.rsec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); }

/* Account Switch */
.swlist { display: flex; flex-direction: column; gap: 4px; max-height: 44vh; overflow: auto; }

.swrow:has(input:checked) { border-color: var(--accent); background: var(--sel); }
.swrow.dis { opacity: .5; cursor: default; }
.swl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swm { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); flex: none; }

/* Terminal Split View & Control Dock */
.dropping { outline: 3px dashed var(--accent); outline-offset: -6px; }
.mini { background: var(--screen); padding: 6px; overflow: hidden; min-height: 120px; }
.mini-in { transform-origin: top left; width: max-content; pointer-events: none; }
.mini .xterm-viewport { overflow: hidden !important; }
.full { display: flex; flex-direction: column; height: 100%; }
.full .screen { flex: 1; min-height: 0; }
.term-split { display: flex; height: 100%; min-height: 0; overflow: hidden; }
.tsplit-left { flex: 1.15; min-width: 280px; display: flex; flex-direction: column; min-height: 0; }
.split-resizer { width: 5px; flex: none; cursor: col-resize; background: var(--line); transition: background .15s; position: relative; }
.split-resizer:hover, .split-resizer.dragging { background: var(--accent); }

.tsplit-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; flex: none; min-width: 0; }
.tsplit-hd > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tsplit-body { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; }
.tsplit-body .chat { padding: 14px 16px 32px; }
.tsplit-pane { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.tsplit-pane[hidden] { display: none !important; }
.win-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding: 7px 10px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel2) 45%, var(--panel)); flex: none; }
.win-tabs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; flex: 1; }
.win-tabs button { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-tabs button.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); font-weight: 600; }
.win-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.win-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; align-items: start; }
.win-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.win-card-hd { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-bottom: 1px solid var(--line); font-size: 12px; min-width: 0; }
.win-card-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.win-shot { background: #0d0f14; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
.win-shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.win-single .win-shot { aspect-ratio: auto; min-height: 220px; max-height: calc(100vh - 290px); }
.win-shot-empty { padding: 18px 12px; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.win-card-ft { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 9px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.win-auto-lbl { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; }
@media (max-width: 1040px) { .term-split { flex-direction: column; } .split-resizer { display: none; } .tsplit-left { border-bottom: 1px solid var(--line); flex: 1 !important; min-width: 0; width: 100%; } .tsplit-right { flex: 1; min-width: 0; width: 100%; } }

/* Composable Drag-and-Drop Docking Panels */
.dock-ws { display: flex; height: 100%; min-height: 0; width: 100%; overflow: hidden; }
.dock-pane { flex: 1 1 0; min-width: 240px; min-height: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; position: relative; transition: box-shadow .12s; }
.dock-pane[hidden] { display: none !important; }
.dock-pane.dragging { opacity: .62; }
.dock-pane.drop-left { box-shadow: inset 3px 0 0 var(--accent); }
.dock-pane.drop-right { box-shadow: inset -3px 0 0 var(--accent); }
.dock-hd { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; flex: none; user-select: none; cursor: grab; min-width: 0; }
.dock-hd:active { cursor: grabbing; }
.dock-grip { display: inline-flex; align-items: center; color: var(--muted); opacity: .65; flex: none; }
.dock-hd:hover .dock-grip { opacity: 1; color: var(--accent); }
.dock-hd-ico { display: inline-flex; align-items: center; flex: none; color: var(--muted); }
.dock-hd-title { font-weight: 650; color: var(--text); white-space: nowrap; }
.dock-hd-extra { display: inline-flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
.dock-hd-acts { display: inline-flex; align-items: center; gap: 2px; flex: none; margin-left: auto; }
.dock-pane.single .dock-hd-acts [data-dock-mv],
.dock-pane.single .dock-hd-acts [data-dock-close] { display: none; }
.dock-body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.dock-resizer { width: 5px; flex: none; cursor: col-resize; background: var(--line); transition: background .15s; }
.dock-resizer:hover, .dock-resizer.dragging { background: var(--accent); }
@media (max-width: 1040px) {
  .dock-ws { flex-direction: column; overflow-y: auto; }
  .dock-resizer { display: none; }
  .dock-pane { flex: 1 0 320px !important; min-width: 0; width: 100%; border-bottom: 1px solid var(--line); }
  .dock-pane.single { flex: 1 1 0 !important; }
  .dock-pane .dock-hd-acts .dock-mv { display: none; }
}

.term-dock { display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--panel); flex: none; }
.tdock-bar { display: flex; align-items: center; gap: 6px; padding: 5px 10px; flex-wrap: wrap; background: color-mix(in srgb, var(--panel2) 55%, var(--panel)); }
.tdock-tools { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tdock-tools button, .tdock-tools .filebtn { min-height: var(--ctrl-h-sm); height: var(--ctrl-h-sm); padding: 0 8px; font-size: 12px; gap: 4px; border-radius: var(--radius-sm); background: var(--panel); }
.tdock-keys-wrap { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.tdock-keys { display: inline-flex; align-items: center; gap: 3px; background: var(--panel2); padding: 2px 3px; border: 1px solid var(--line); border-radius: var(--radius-md); flex-wrap: wrap; }
.tdock-keys[hidden] { display: none !important; }
.tdock-keys button { min-height: 24px; height: 24px; min-width: 24px; padding: 0 7px; font-size: 11.5px; font-family: "Cascadia Mono", Consolas, monospace; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); }
.tdock-keys button:hover { border-color: var(--accent); color: var(--accent); }
.tdock-comp { display: flex; align-items: flex-end; gap: 8px; padding: 7px 10px 9px; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); background: var(--panel); }
.tdock-comp[hidden] { display: none !important; }
.tdock-comp textarea { flex: 1; min-width: 160px; min-height: 36px; max-height: 140px; padding: 7px 11px; font-size: 13.5px; line-height: 1.45; border-radius: var(--radius-md); background: var(--bg); border: 1px solid var(--line-strong); resize: none; overflow-y: auto; }
.tdock-comp textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
.tdock-comp #tsend, .tdock-comp #btnSend { min-height: 36px; height: 36px; padding: 0 14px; font-weight: 600; flex: none; }
.note { display: none; }
.ico { display: inline-flex; align-items: center; justify-content: center; vertical-align: -2px; flex: none; }

/* Natural Modern Chat Conversation */
.chat { padding: 20px 24px 56px; width: 100%; max-width: 860px; min-width: 0; box-sizing: border-box; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.chat-day { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 11.5px; font-weight: 600; margin: 6px 0 2px; }
.chat-day::before, .chat-day::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.msg { margin: 0; position: relative; min-width: 0; max-width: 100%; }
.msg.target { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 14px; }

/* User message: sleek right-aligned chat bubble */
.msg.user { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.msg.user .msg-bubble { background: var(--sel); border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); border-radius: 18px 18px 4px 18px; padding: 10px 15px; max-width: min(76%, 620px); min-width: 0; color: var(--text); box-shadow: var(--shadow-low); overflow-wrap: anywhere; }
.msg.user .msg-bubble:has(.msg-edit-box) { width: min(100%, 560px); max-width: 100%; }
.msg.user .msg-body { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.6; font-size: 13.5px; }
.msg.user .msg-meta { display: inline-flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--muted); padding: 0 4px; max-width: 100%; }

/* Assistant message: airy editorial chat row with avatar */
.msg.assistant { display: flex; align-items: flex-start; gap: 11px; max-width: 100%; min-width: 0; }
.msg-av { flex: none; margin-top: 2px; }
.msg-av .ag-ico { width: 26px; height: 26px; border-radius: 8px; }
.msg-av .ag-ico img { width: 17px; height: 17px; }
.msg-col { flex: 1; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 5px; }
.msg-hd { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); line-height: 1; flex-wrap: wrap; min-width: 0; max-width: 100%; }
.msg-hd .w-role { font-weight: 650; color: var(--text); }
.msg-hd .w-ts { font-size: 11px; }
.msg.assistant .msg-bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 13px 16px; box-shadow: var(--shadow-low); min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.msg.assistant .md { font-size: 13.5px; line-height: 1.68; word-break: keep-all; overflow-wrap: anywhere; }
.msg.assistant .md > :first-child { margin-top: 0; }
.msg.assistant .md > :last-child { margin-bottom: 0; }
.msg.assistant .md ul, .msg.assistant .md ol { margin: 6px 0; padding-left: 20px; }
.msg.assistant .md li { margin: 3px 0; }
.msg-acts { display: inline-flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .12s; }
.msg:hover .msg-acts, .msg:focus-within .msg-acts { opacity: 1; }
.msg-copy { opacity: 0; transition: opacity .12s; }
.msg:hover .msg-copy, .msg:focus-within .msg-copy { opacity: 1; }
@media (pointer: coarse) { .msg-acts, .msg-copy { opacity: .7; } }
.msg-edit-box { display: flex; flex-direction: column; gap: 8px; width: min(520px, 100%); min-width: 0; max-width: 100%; box-sizing: border-box; }
.msg-edit-box textarea { width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; min-height: 76px; max-height: 280px; padding: 9px 11px; font-size: 13.5px; line-height: 1.5; border-radius: var(--radius-md); background: var(--bg); color: var(--text); border: 1px solid var(--accent); resize: vertical; }
.msg-edit-foot { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; max-width: 100%; }
.chat-lineage { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; border-radius: 10px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--badge-gcal) 28%, var(--line)); font-size: 12.5px; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; overflow-wrap: anywhere; }
.chat-lineage-list { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; min-width: 0; max-width: 100%; }
.msg-branches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; max-width: 100%; min-width: 0; }

/* Dialogs & Right-Side Detail Drawer */
.dlg { position: fixed; inset: 0; background: rgba(0,0,0,.38); display: flex; align-items: center; justify-content: center; z-index: 40; }
.dlg .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; width: min(520px, 92vw); display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-med); }
